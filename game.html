<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requiem : Utopia | 游戏</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #030304; overflow: hidden; }
        iframe { width: 100vw; height: 100vh; border: none; display: block; }
        
        /* 左上角专属返回按钮 */
        .back-btn {
            position: fixed; top: 20px; left: 20px;
            background: rgba(8, 8, 10, 0.85); 
            border: 1px solid #c9a063; color: #c9a063;
            padding: 10px 20px; border-radius: 4px;
            font-family: 'Noto Serif SC', serif; font-size: 1rem;
            text-decoration: none; z-index: 9999;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.3s; box-shadow: 0 0 15px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }
        .back-btn:hover { background: #8b0000; color: #fff; box-shadow: 0 0 20px rgba(204,0,0,0.6); transform: translateX(-5px); }
        
        /* 加载遮罩 */
        #game-loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #030304; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease;
        }
        .loader-text { font-family: 'Cinzel', serif; color: #c9a063; font-size: 1.5rem; letter-spacing: 8px; animation: pulse 2s infinite alternate; }
        @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 1; text-shadow: 0 0 15px #cc0000; } }
    </style>
</head>
<body>

    <div id="game-loader">
        <h1 class="loader-text">Requiem 加载中...</h1>
    </div>

    <!-- 你的华丽返回按钮 -->
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回主页</a>

    <!-- 这里填你之前做好的独立游戏网址 -->
    <iframe id="game-iframe" src="https://yueyismile.github.io/my-yoc-game/" allowfullscreen></iframe>

    <script>
        const iframe = document.getElementById('game-iframe');
        const loader = document.getElementById('game-loader');
        iframe.onload = function() {
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 1000);
            }, 1000);
        };
    </script>
</body>
</html>
