<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月翼smile的小站 </title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+SC:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030304;
            --bg-card: rgba(10, 10, 14, 0.85);
            --text-main: #e8e8eb;
            --text-muted: #8a8a93;
            --accent-gold: #c9a063;
            --accent-crimson: #8b0000;
            --accent-blood: #cc0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Noto Serif SC', serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
            /* 极繁暗纹 + 强烈的呼吸红光 */
            background-image: 
                url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 25 C60 35, 70 45, 50 65 C30 45, 40 35, 50 25 Z M50 65 C60 75, 70 85, 50 95 C30 85, 40 75, 50 65 Z M25 50 C35 60, 45 70, 50 65 C40 55, 35 45, 25 50 Z M75 50 C65 60, 55 70, 50 65 C60 55, 65 45, 75 50 Z" fill="none" stroke="rgba(201,160,99,0.04)" stroke-width="1"/><circle cx="50" cy="50" r="2" fill="rgba(139,0,0,0.08)"/></svg>'),
                radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.25), transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(139, 0, 0, 0.2), transparent 60%);
            background-size: 100px 100px, 100% 100%, 100% 100%;
            background-attachment: fixed;
            position: relative;
        }

        /* === 华丽页边距 === */
        .page-border {
            position: fixed; top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px solid rgba(201, 160, 99, 0.15); pointer-events: none; z-index: 999;
        }
        .page-border::before, .page-border::after {
            content: '✟'; position: absolute; color: rgba(201, 160, 99, 0.3); font-size: 1.5rem;
        }
        .page-border::before { top: -12px; left: -8px; }
        .page-border::after { bottom: -12px; right: -8px; }

        /* === 四角巨型玫瑰图腾 === */
        .corner-rose {
            position: fixed; width: 400px; height: 400px;
            pointer-events: none; z-index: 0; opacity: 0.15;
            filter: drop-shadow(0 0 30px rgba(139, 0, 0, 0.6));
            animation: floatRose 6s ease-in-out infinite alternate;
        }
        .corner-tl { top: -80px; left: -80px; --rot: 0deg; }
        .corner-tr { top: -80px; right: -80px; --rot: 90deg; }
        .corner-bl { bottom: -80px; left: -80px; --rot: -90deg; }
        .corner-br { bottom: -80px; right: -80px; --rot: 180deg; }

        @keyframes floatRose {
            0% { opacity: 0.1; transform: scale(1) rotate(var(--rot, 0deg)); }
            100% { opacity: 0.25; transform: scale(1.05) rotate(var(--rot, 0deg)); }
        }

        /* === 纯红玫瑰风暴 === */
        .petals-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 100; overflow: hidden;
        }
        .petal {
            position: absolute;
            border-radius: 100% 0% 100% 0% / 100% 0% 100% 0%;
            opacity: 0;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.4); /* 红晕发光 */
            animation: fall linear infinite, sway ease-in-out infinite alternate;
        }
        
        @keyframes fall {
            0% { top: -10vh; opacity: 0; transform: scale(0.8); }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { top: 110vh; opacity: 0; transform: scale(1.2); }
        }
        @keyframes sway {
            0% { transform: translateX(-50px) rotate(0deg); }
            100% { transform: translateX(50px) rotate(360deg); }
        }

        /* =========================================
           第一屏：哥特时钟与玫瑰
           ========================================= */
        .hero-section {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            position: relative; z-index: 1;
        }

        .gothic-clock {
            position: absolute; width: 700px; height: 700px;
            border-radius: 50%;
            border: 2px solid rgba(201, 160, 99, 0.2);
            box-shadow: inset 0 0 100px rgba(139, 0, 0, 0.2), 0 0 60px rgba(0,0,0,0.9);
            z-index: -1; display: flex; justify-content: center; align-items: center;
        }
        /* 华丽的外圈花边 */
        .gothic-clock::before {
            content: ''; position: absolute; width: 105%; height: 105%; border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, transparent 0deg 45deg, rgba(201, 160, 99, 0.08) 45deg 90deg);
            z-index: -1;
        }
        /* 内部罗马数字刻度外框 */
        .clock-face {
            position: absolute; width: 85%; height: 85%;
            background: repeating-conic-gradient(from 0deg, transparent 0deg 5.5deg, rgba(201, 160, 99, 0.1) 5.5deg 6deg);
            border-radius: 50%; border: 1px solid rgba(201, 160, 99, 0.15);
        }

        .roman-numeral {
            position: absolute; color: rgba(201, 160, 99, 0.7);
            font-family: 'Cinzel', serif; font-size: 2rem; font-weight: bold;
            text-shadow: 0 0 15px rgba(201, 160, 99, 0.5);
        }
        .num-12 { top: 40px; }
        .num-3 { right: 40px; }
        .num-6 { bottom: 40px; }
        .num-9 { left: 40px; }

        /* 华丽指针：带剑柄形状 */
        .clock-hand {
            position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center;
            background: linear-gradient(to top, transparent, var(--accent-gold));
            clip-path: polygon(50% 0%, 100% 20%, 50% 100%, 0% 20%); /* 剑形 */
            border-radius: 2px;
        }
        .hour-hand { width: 12px; height: 180px; margin-left: -6px; animation: rotateHand 120s linear infinite; opacity: 0.6; }
        .minute-hand { width: 8px; height: 260px; margin-left: -4px; animation: rotateHand 30s linear infinite; opacity: 0.8; }
        @keyframes rotateHand { 100% { transform: rotate(360deg); } }

        /* 中心宝石 */
        .clock-center {
            position: absolute; width: 30px; height: 30px;
            background: radial-gradient(circle, #ff0000, #4a0000);
            border-radius: 50%; box-shadow: 0 0 30px var(--accent-blood); z-index: 2;
            border: 2px solid var(--accent-gold);
        }

        .rose-watermark {
            position: absolute; width: 500px; height: 500px; z-index: -1;
            opacity: 0.3; animation: slowPulse 8s infinite alternate;
        }
        @keyframes slowPulse {
            0% { transform: scale(1); opacity: 0.2; filter: drop-shadow(0 0 15px var(--accent-crimson)); }
            100% { transform: scale(1.05); opacity: 0.4; filter: drop-shadow(0 0 40px var(--accent-blood)); }
        }

        .hero-title {
            font-family: 'Cinzel', serif; font-size: 5.5rem; font-weight: 900;
            letter-spacing: 18px; text-transform: uppercase; margin-bottom: 30px;
            background: linear-gradient(to right, #d1d1d6, #fff, var(--accent-gold), #fff, #d1d1d6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 50px rgba(139, 0, 0, 0.5); /* 强烈的血光 */
            animation: fadeIn 2s ease-out;
        }

        .hero-divider {
            display: flex; align-items: center; gap: 20px; margin-bottom: 30px;
            animation: fadeIn 2.5s ease-out;
        }
        .divider-line { width: 180px; height: 3px; border-top: 1px solid #444; border-bottom: 1px solid #444; }
        .divider-diamond { width: 10px; height: 10px; border: 1px solid var(--accent-blood); transform: rotate(45deg); background: rgba(139,0,0,0.2); }
        .divider-icon { color: var(--accent-blood); font-size: 1.2rem; text-shadow: 0 0 10px var(--accent-blood); }

        .hero-subtitle {
            font-size: 1.1rem; color: var(--text-muted); letter-spacing: 15px; text-transform: uppercase;
            animation: fadeIn 3s ease-out;
        }

        .scroll-down {
            position: absolute; bottom: 40px; color: var(--text-muted); font-size: 1.5rem;
            animation: bounce 2s infinite; cursor: pointer; transition: all 0.3s;
        }
        .scroll-down:hover { color: var(--accent-blood); }

        /* =========================================
           第二屏：奢华名片 (增加流光扫过)
           ========================================= */
        .author-section {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 80px 20px; position: relative; z-index: 1;
        }

        .card-wrapper {
            padding: 15px; border: 1px dashed rgba(201, 160, 99, 0.4);
            border-radius: 6px; max-width: 950px; width: 100%; position: relative;
            overflow: hidden; /* 用于流光效果 */
        }

        /* 卡片外圈流光 */
        .card-wrapper::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(204, 0, 0, 0.2), transparent);
            animation: sweepLight 4s infinite linear; pointer-events: none;
        }
        @keyframes sweepLight {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .profile-card {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(201, 160, 99, 0.6);
            border-radius: 2px; padding: 60px 50px;
            display: flex; gap: 60px;
            box-shadow: inset 0 0 80px rgba(139,0,0,0.2), 0 20px 50px rgba(0,0,0,0.95);
            position: relative; overflow: hidden;
        }

        /* 卡片背景玫瑰残影 */
        .profile-card::before {
            content: ''; position: absolute; bottom: -80px; right: -80px; width: 350px; height: 350px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 15 C65 30, 85 40, 85 60 C85 80, 65 90, 50 95 C35 90, 15 80, 15 60 C15 40, 35 30, 50 15 Z" fill="none" stroke="rgba(204,0,0,0.2)" stroke-width="2"/></svg>') no-repeat center;
            background-size: contain; z-index: 0; pointer-events: none; transform: rotate(-30deg);
        }

        .corner-deco {
            position: absolute; width: 60px; height: 60px; border: 1px solid var(--accent-gold); pointer-events: none; z-index: 2;
        }
        .top-left { top: 8px; left: 8px; border-right: none; border-bottom: none; }
        .top-right { top: 8px; right: 8px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 8px; left: 8px; border-right: none; border-top: none; }
        .bottom-right { bottom: 8px; right: 8px; border-left: none; border-top: none; }

        .profile-left { flex-shrink: 0; text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }

        .avatar-container {
            width: 180px; height: 180px; border-radius: 50%; padding: 4px;
            border: 1px solid #444; position: relative; margin-bottom: 25px;
            box-shadow: 0 0 50px rgba(139,0,0,0.5); /* 头像外发光 */
        }
        .avatar-container::before {
            content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%; border: 1px dashed rgba(204, 0, 0, 0.6); animation: rotateHand 40s linear infinite;
        }
        .avatar-container::after {
            content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border-radius: 50%; border: 2px solid var(--accent-gold); pointer-events: none;
        }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid #000; }

        .author-name { font-family: 'Cinzel', serif; font-size: 2.2rem; color: var(--text-main); letter-spacing: 3px; margin-bottom: 8px; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .author-tag { font-size: 0.85rem; color: var(--accent-blood); letter-spacing: 2px; text-transform: uppercase; }

        .profile-right { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 1; }

        .section-heading {
            font-size: 1.3rem; color: var(--text-main); margin-bottom: 25px;
            display: flex; align-items: center; gap: 20px; letter-spacing: 3px; font-weight: 600;
        }
        .section-heading::before, .section-heading::after {
            content: ''; flex-grow: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--accent-blood), transparent);
        }

        .author-bio { font-size: 1.05rem; color: var(--text-muted); line-height: 2.2; text-align: justify; margin-bottom: 35px; }
        .author-bio::first-letter {
            font-family: 'Cinzel', serif; font-size: 3.5rem; color: var(--accent-gold);
            float: left; line-height: 0.8; margin-right: 10px; margin-top: 5px;
        }

        .stats-board {
            display: flex; gap: 40px; margin-bottom: 35px;
            padding: 20px 0; border-top: 1px solid #333; border-bottom: 1px solid #333;
        }
        .stat-item h4 { color: var(--accent-gold); font-size: 1.6rem; font-family: 'Cinzel', serif; margin-bottom: 5px; }
        .stat-item p { color: var(--text-muted); font-size: 0.8rem; letter-spacing: 2px; }

        .social-links { display: flex; gap: 15px; flex-wrap: wrap; }
        .social-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 25px; background: transparent; color: var(--text-main);
            text-decoration: none; border: 1px solid #444; transition: all 0.4s; font-size: 0.9rem;
        }
        .social-btn:hover {
            border-color: var(--accent-blood); color: #fff;
            box-shadow: inset 0 0 15px rgba(204, 0, 0, 0.2), 0 0 20px rgba(204, 0, 0, 0.3);
        }

        /* =========================================
           第三屏：画廊
           ========================================= */
        .oc-preview-section {
            padding: 80px 5% 100px; text-align: center;
            background: radial-gradient(circle at center bottom, rgba(139,0,0,0.1), transparent);
            position: relative; z-index: 1;
        }

        .big-title {
            font-family: 'Cinzel', serif; font-size: 2.5rem; color: var(--text-main);
            margin-bottom: 60px; letter-spacing: 10px;
            display: flex; align-items: center; justify-content: center; gap: 25px;
            text-shadow: 0 0 20px rgba(139,0,0,0.6);
        }
        .big-title::before, .big-title::after {
            content: ''; width: 120px; height: 2px; border-top: 1px solid var(--accent-blood); border-bottom: 1px solid var(--accent-blood);
        }

        .preview-grid { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-bottom: 70px; }

        .preview-card {
            width: 260px; height: 380px; background: #000; 
            border: 1px solid var(--accent-gold); padding: 10px;
            position: relative; transition: all 0.5s; cursor: pointer;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.2);
        }
        .preview-card-inner { width: 100%; height: 100%; border: 1px solid #333; position: relative; overflow: hidden; }
        .preview-card:hover { transform: translateY(-10px) scale(1.02); box-shadow: 0 20px 50px rgba(204, 0, 0, 0.5), 0 0 30px rgba(201, 160, 99, 0.3); border-color: var(--accent-blood); }

        /* 双层金框 */
        .preview-card::after {
            content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(201, 160, 99, 0.4); pointer-events: none;
        }

        .preview-img {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.5;
            filter: grayscale(100%) contrast(1.2); transition: all 0.6s;
        }
        .preview-card:hover .preview-img { opacity: 1; filter: grayscale(0%) contrast(1); transform: scale(1.1); }

        .preview-text {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            color: #fff; font-family: 'Cinzel', serif; font-size: 1.2rem;
            letter-spacing: 3px; text-shadow: 0 0 10px #000, 0 0 20px var(--accent-blood);
        }

        .btn-epic {
            display: inline-block; padding: 20px 70px;
            font-family: 'Noto Serif SC', serif; font-size: 1.2rem;
            color: var(--accent-gold); background: rgba(0,0,0,0.5);
            text-decoration: none; font-weight: 600; letter-spacing: 6px;
            border: 1px solid var(--accent-gold); position: relative; overflow: hidden; z-index: 1;
            transition: all 0.4s; box-shadow: 0 0 20px rgba(201, 160, 99, 0.1);
        }
        .btn-epic::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(204, 0, 0, 0.4), transparent);
            transition: all 0.5s ease; z-index: -1;
        }
        .btn-epic:hover::before { left: 100%; }
        .btn-epic:hover { box-shadow: 0 0 50px rgba(204, 0, 0, 0.5); border-color: var(--accent-blood); color: #fff; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }

        @media (max-width: 768px) {
            .gothic-clock { width: 350px; height: 350px; }
            .hour-hand { height: 90px; } .minute-hand { height: 130px; }
            .rose-watermark { width: 250px; height: 250px; }
            .hero-title { font-size: 2.8rem; letter-spacing: 5px; }
            .profile-card { flex-direction: column; padding: 40px 20px; gap: 40px; }
            .card-wrapper { padding: 8px; }
            .stats-board { flex-wrap: wrap; justify-content: center; }
            .author-bio::first-letter { font-size: 2.5rem; }
            .corner-rose { width: 200px; height: 200px; opacity: 0.1; }
        }
    </style>
</head>
<body>

    <div class="page-border"></div>

    <svg class="corner-rose corner-tl" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L100 0 L100 20 C80 20, 60 30, 50 50 C40 70, 20 80, 0 100 Z" fill="none" stroke="var(--accent-gold)" stroke-width="0.5"/>
        <path d="M50 50 C60 40, 70 30, 80 30 C90 30, 90 40, 80 50 C70 60, 60 70, 50 80 C40 70, 30 60, 20 60 C10 60, 10 50, 20 40 C30 30, 40 40, 50 50 Z" fill="none" stroke="var(--accent-blood)" stroke-width="1"/>
        <path d="M40 40 C50 30, 60 20, 70 20 C80 20, 80 30, 70 40 C60 50, 50 60, 40 70 C30 60, 20 50, 10 50 C0 50, 0 40, 10 30 C20 20, 30 30, 40 40 Z" fill="none" stroke="var(--accent-gold)" stroke-width="0.5" stroke-dasharray="2 2"/>
    </svg>
    <svg class="corner-rose corner-tr" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L100 0 L100 20 C80 20, 60 30, 50 50 C40 70, 20 80, 0 100 Z" fill="none" stroke="var(--accent-gold)" stroke-width="0.5"/>
        <path d="M50 50 C60 40, 70 30, 80 30 C90 30, 90 40, 80 50 C70 60, 60 70, 50 80 C40 70, 30 60, 20 60 C10 60, 10 50, 20 40 C30 30, 40 40, 50 50 Z" fill="none" stroke="var(--accent-blood)" stroke-width="1"/>
        <path d="M40 40 C50 30, 60 20, 70 20 C80 20, 80 30, 70 40 C60 50, 50 60, 40 70 C30 60, 20 50, 10 50 C0 50, 0 40, 10 30 C20 20, 30 30, 40 40 Z" fill="none" stroke="var(--accent-gold)" stroke-width="0.5" stroke-dasharray="2 2"/>
    </svg>
    <svg class="corner-rose corner-bl" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L100 0 L100 20 C80 20, 60 30, 50 50 C40 70, 20 80, 0 100 Z" fill="none" stroke="var(--accent-gold)" stroke-width="0.5"/>
        <path d="M50 50 C60 40, 70 30, 80 30 C90 30, 90 40, 80 50 C70 60, 60 70, 50 80 C40 70, 30 60, 20 60 C10 60, 10 50, 20 40 C30 30, 40 40, 50 50 Z" fill="none" stroke="var(--accent-blood)" stroke-width="1"/>
        <path d="M40 40 C50 30, 60 20, 70 20 C80 20, 80 30, 70 40 C60 50, 50 60, 40 70 C30 60, 20 50, 10 50 C0 50, 0 40, 10 30 C20 20, 30 30, 40 40 Z" fill="none" stroke="var(--accent-gold)" stroke-width="0.5" stroke-dasharray="2 2"/>
    </svg>
    <svg class="corner-rose corner-br" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L100 0 L100 20 C80 20, 60 30, 50 50 C40 70, 20 80, 0 100 Z" fill="none" stroke="var(--accent-gold)" stroke-width="0.5"/>
        <path d="M50 50 C60 40, 70 30, 80 30 C90 30, 90 40, 80 50 C70 60, 60 70, 50 80 C40 70, 30 60, 20 60 C10 60, 10 50, 20 40 C30 30, 40 40, 50 50 Z" fill="none" stroke="var(--accent-blood)" stroke-width="1"/>
        <path d="M40 40 C50 30, 60 20, 70 20 C80 20, 80 30, 70 40 C60 50, 50 60, 40 70 C30 60, 20 50, 10 50 C0 50, 0 40, 10 30 C20 20, 30 30, 40 40 Z" fill="none" stroke="var(--accent-gold)" stroke-width="0.5" stroke-dasharray="2 2"/>
    </svg>

    <div class="petals-container" id="petals"></div>

    <section class="hero-section" id="top">
        
        <div class="gothic-clock">
            <div class="clock-face"></div>
            <div class="roman-numeral num-12">XII</div>
            <div class="roman-numeral num-3">III</div>
            <div class="roman-numeral num-6">VI</div>
            <div class="roman-numeral num-9">IX</div>
            <div class="clock-hand hour-hand"></div>
            <div class="clock-hand minute-hand"></div>
            <div class="clock-center"></div>
        </div>

        <svg class="rose-watermark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 10 C60 20, 80 20, 80 40 C80 60, 60 70, 50 90 C40 70, 20 60, 20 40 C20 20, 40 20, 50 10 Z" fill="none" stroke="var(--accent-blood)" stroke-width="0.8"/>
            <path d="M50 20 C55 25, 70 25, 70 40 C70 55, 55 60, 50 80 C45 60, 30 55, 30 40 C30 25, 45 25, 50 20 Z" fill="none" stroke="var(--accent-gold)" stroke-width="0.5" stroke-dasharray="2 2"/>
            <circle cx="50" cy="45" r="6" fill="none" stroke="var(--accent-blood)" stroke-width="1"/>
            <path d="M50 10 L50 5 M50 90 L50 95 M10 50 L5 50 M90 50 L95 50" stroke="var(--accent-gold)" stroke-width="1"/>
        </svg>

        <h1 class="hero-title">月翼smile</h1>
        <div class="hero-divider">

    <script>
        const petalsContainer = document.getElementById('petals');
        // 纯正血色花瓣：暗红、猩红、酒红、深红
        const redColors = [
            'radial-gradient(circle at 30% 30%, #ff1a1a, #4a0000)', // 鲜血亮红
            'radial-gradient(circle at 30% 30%, #cc0000, #1a0000)', // 经典正红
            'radial-gradient(circle at 30% 30%, #8b0000, #2a0000)', // 暗红
            'radial-gradient(circle at 30% 30%, #660000, #0a0000)'  // 酒红极暗
        ];

        for (let i = 0; i < 150; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 18 + 5; 
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.background = redColors[Math.floor(Math.random() * redColors.length)];
            
            const fallDuration = Math.random() * 8 + 6; 
            const swayDuration = Math.random() * 2 + 1.5;
            const delay = Math.random() * 15;
            
            petal.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
            petal.style.animationDelay = `${delay}s, 0s`;
            petal.style.transform = `rotate(${Math.random() * 360}deg)`;

            petalsContainer.appendChild(petal);
        }
    </script>
