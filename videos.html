    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-dark: #030304; --text-main: #e8e8eb; --text-muted: #8a8a93; --accent-blue: #00a1d6; --accent-gold: #c9a063; --accent-blood: #cc0000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Noto Serif SC', serif; overflow-x: hidden; cursor: crosshair;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 161, 214, 0.15), transparent 60%);
            background-attachment: fixed; min-height: 100vh;
        }
        .page-border { position: fixed; top: 15px; left: 15px; right: 15px; bottom: 15px; border: 1px solid rgba(201, 160, 99, 0.15); pointer-events: none; z-index: 999; }
        .nav-bar { display: flex; justify-content: center; padding: 40px 0; position: relative; z-index: 10; }
        .back-btn { color: var(--text-muted); text-decoration: none; font-size: 1.1rem; letter-spacing: 2px; transition: all 0.3s; }
        .back-btn:hover { color: var(--accent-blood); text-shadow: 0 0 10px var(--accent-blood); }
        .page-title { text-align: center; font-family: 'Cinzel', serif; font-size: 3.5rem; color: var(--text-main); letter-spacing: 10px; margin-bottom: 20px; text-shadow: 0 0 30px rgba(0, 161, 214, 0.4); }
        .page-subtitle { text-align: center; color: var(--text-muted); letter-spacing: 5px; margin-bottom: 60px; }
        .player-container { max-width: 1200px; margin: 0 auto 50px; padding: 0 5%; }
        .player-frame {
            background: rgba(10, 10, 14, 0.9);
            border: 1px solid var(--accent-blue);
            box-shadow: 0 0 50px rgba(0, 161, 214, 0.2), inset 0 0 50px rgba(0,0,0,0.8);
            border-radius: 8px; padding: 15px; position: relative; margin-bottom: 60px;
        }
        .player-title { text-align: center; color: var(--accent-gold); font-family: 'Cinzel', serif; font-size: 1.5rem; margin-bottom: 15px; letter-spacing: 3px; }
        .player-frame iframe { width: 100%; height: 650px; border: none; border-radius: 4px; display: block; background: #000; }
        .copyright { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 30px; border-top: 1px solid rgba(201, 160, 99, 0.1); }
        @media (max-width: 768px) { .page-title { font-size: 2.5rem; } .player-frame iframe { height: 300px; } }
    </style>
</head>
